name: CI

# Package tests and a simulator build of the app target. UI tests and anything that
# needs a device or the on-device model stay local.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-tests:
    name: Package tests
    # The package imports Apple frameworks, so it cannot build on Linux.
    # macOS minutes cost about ten times Linux ones: keep this job small.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ${{ vars.CI_RUNNER || 'macos-26' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        run: |
          newest="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          echo "DEVELOPER_DIR=$newest/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$newest/Contents/Developer" xcodebuild -version

      - name: Swift package tests
        # Parallel: the briefing deadline and typing pause sleep on an injected clock,
        # and the tests advance it by hand, so a slow runner cannot make a deadline fire.
        run: ./scripts/test.sh

      - name: Scorer tests
        run: python3 -m unittest discover -s scripts/tests

  app-build:
    name: App build
    # Compiles the app, widget and UI-test targets for the simulator; nothing is run.
    # It catches what the package tests cannot: an app target that no longer compiles.
    # The app uses iOS 27 audio and recording APIs, so it needs the Xcode 27 image
    # (a GitHub public preview); the iOS 26 SDK on macos-26 cannot build it.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        run: |
          newest="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          echo "DEVELOPER_DIR=$newest/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$newest/Contents/Developer" xcodebuild -version

      - name: Build for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project MorningOperator.xcodeproj -scheme MorningOperator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/xcode CODE_SIGNING_ALLOWED=NO build-for-testing \
            | tee xcodebuild.log | grep -E "error:|warning: unable|BUILD|\*\* " || true
          grep -q "TEST BUILD SUCCEEDED" xcodebuild.log

