name: UI tests

# Runs the app's UI tests on a hosted iOS simulator: every night that main moved,
# and on pull requests that touch the app, its resources or the tests. Nothing here
# needs a device, the on-device model, a microphone or a signing identity; the
# tests that do skip themselves and say why. Kept apart from ci.yml so the package
# tests and the app build stay quick.
on:
  schedule:
    - cron: "17 2 * * *"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "UITests/**"
      - "Sources/MorningOperator/**"
      - "Sources/MorningActivityWidget/**"
      - "Resources/**"
      - "project.yml"
      - "MorningOperator.xcodeproj/**"
      - "scripts/ui-tests-ci.py"
      - ".github/workflows/ui-tests.yml"

concurrency:
  group: ui-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep the three existing partitions and give the real-minute long routine
  # its own shard. The test step remains bounded at 80 minutes. Each named
  # class belongs to one shard; everything-else picks up unlisted classes.
  MORNING_CLASSES: QuietMorningTests SunriseDockTests MorningEntryUITests FixtureJourneyTests MorningBriefingTests CompletionCaptureTests PrivacyTests RoutineTransferTests
  PROPOSAL_CLASSES: RoutineEvidenceProposalTests ObservationReviewJourneyTests
  LONG_ROUTINE_CLASSES: ImportedLongRoutineJourneyTests

jobs:
  guard:
    name: Anything new to test
    # A pull request always has something new. The nightly run only works when
    # main received a commit since the previous night.
    if: >-
      (github.event_name == 'schedule' && github.repository == 'gibouu/morning-operator') ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
        with:
          persist-credentials: false

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Main only moves through pull requests merged on GitHub, so the newest
          # commit's committer date is the time it reached main. One hour over
          # the 24 covers a schedule that starts late: a commit is never missed,
          # at the price of an occasional second run on the same commit.
          committed="$(git log -1 --format=%ct)"
          age=$(( $(date +%s) - committed ))
          echo "Newest commit on main: $(git log -1 --format='%h %cI'), $(( age / 3600 )) h old."
          if [ "$age" -le $(( 25 * 3600 )) ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Main did not move in the last day: nothing to test." >> "$GITHUB_STEP_SUMMARY"
          fi

  ui-tests:
    name: UI tests (${{ matrix.shard }})
    needs: guard
    if: needs.guard.outputs.run == 'true'
    # The app uses iOS 27 APIs, so it needs the Xcode 27 image and its iOS 27
    # simulators. This repository is public: hosted runners only.
    runs-on: xcode-27
    # 45 minutes was the first guess; measured test time is 40 to 52 minutes a
    # shard once the tests run to their end, plus about 8 for the build and 3
    # for the largest-text pass. A stuck run still stops.
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        shard: [morning, proposals, everything-else, long-routine]
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The image's default Xcode on purpose: the newest one installed there can be a beta.
      - name: Show the Xcode in use
        run: xcodebuild -version

      - name: Choose this shard's tests
        run: |
          allowance=900
          case "$SHARD" in
            morning) selection="$(python3 scripts/ui-tests-ci.py select only $MORNING_CLASSES)" ;;
            proposals) selection="$(python3 scripts/ui-tests-ci.py select only $PROPOSAL_CLASSES)" ;;
            everything-else) selection="$(python3 scripts/ui-tests-ci.py select skip $MORNING_CLASSES $PROPOSAL_CLASSES $LONG_ROUTINE_CLASSES)" ;;
            long-routine) selection="$(python3 scripts/ui-tests-ci.py select only $LONG_ROUTINE_CLASSES)"; allowance=2700 ;;
            *) echo "Unknown shard: $SHARD" >&2; exit 1 ;;
          esac
          echo "$selection"
          echo "SELECTION=$selection" >> "$GITHUB_ENV"
          echo "TEST_ALLOWANCE=$allowance" >> "$GITHUB_ENV"

      # No device name is written here: the image's simulators change with each
      # Xcode. The script takes an iPhone on the newest iOS runtime this Xcode supports.
      - name: Pick and boot an iPhone simulator
        run: |
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          udid="$(xcrun simctl list devices available -j | python3 scripts/ui-tests-ci.py pick-simulator --max-os "$sdk")"
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      # Every xcodebuild step below fails on xcodebuild's own exit status.
      - name: Build the app and the UI tests
        id: build
        run: |
          xcodebuild build-for-testing -project MorningOperator.xcodeproj -scheme MorningOperator \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath .build/xcode CODE_SIGNING_ALLOWED=NO -quiet

      # One simulator, one test at a time, no retry. Only the long-routine shard
      # permits 45 minutes per test for its real budgets; all others keep 15.
      - name: Run the UI tests
        timeout-minutes: 80
        run: |
          xcodebuild test-without-building -project MorningOperator.xcodeproj -scheme MorningOperator \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath .build/xcode -resultBundlePath ui-tests.xcresult \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance "$TEST_ALLOWANCE" \
            -maximum-test-execution-time-allowance "$TEST_ALLOWANCE" \
            CODE_SIGNING_ALLOWED=NO $SELECTION

      # The largest-text checks need the simulator's own text size changed, so
      # they run as a second pass. At the standard size they skip themselves.
      - name: Run the largest-text checks
        if: ${{ !cancelled() && matrix.shard == 'everything-else' && steps.build.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          xcrun simctl ui "$UDID" content_size accessibility-extra-extra-extra-large
          xcodebuild test-without-building -project MorningOperator.xcodeproj -scheme MorningOperator \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath .build/xcode -resultBundlePath ui-tests-largest-text.xcresult \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:MorningOperatorUITests/QuietMorningAccessibilityTests \
            -only-testing:MorningOperatorUITests/InterfaceTourTests/testLargestTextTourOfHomeLearnReviewAndSettings \
            -only-testing:MorningOperatorUITests/EvidenceRetentionTests/testLargestTextScreens

      # The summaries can fail the job (nothing ran, a failure in the bundle, a
      # skip in the largest-text pass, a bundle left unreadable by a run that hit
      # its time limit) but cannot make a failed run pass. They run whatever
      # happened before, so a failed build or a timeout still leaves its line.
      - name: Summarize
        if: ${{ always() }}
        run: |
          python3 scripts/ui-tests-ci.py summary ui-tests.xcresult \
            --title "UI tests ($SHARD)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

      - name: Summarize the largest-text checks
        if: ${{ always() && matrix.shard == 'everything-else' }}
        run: |
          python3 scripts/ui-tests-ci.py summary ui-tests-largest-text.xcresult --no-skips \
            --title "Largest text size" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

      # The bundles hold screenshots of synthetic fixture data on a fresh hosted
      # simulator, test logs and no system diagnostics. Kept a week.
      - name: Keep the result bundles
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-tests-${{ matrix.shard }}-xcresult
          path: |
            ui-tests.xcresult
            ui-tests-largest-text.xcresult
          retention-days: 7
          if-no-files-found: warn
